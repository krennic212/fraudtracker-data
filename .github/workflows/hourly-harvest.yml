name: Hourly ledger harvest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-ledger-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      LEDGER_HARVEST_FILE: data/harvest.json
      LEDGER_STATUS_FILE: data/harvest-status.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: node --test scripts/ledger-dedupe.test.mjs scripts/harvest-parse.test.mjs
      - name: Harvest official papers
        run: node scripts/harvest-gov.mjs
      - name: Cut duplicates, blank photos
        run: node scripts/ledger-dedupe.mjs data/harvest.json
      - name: Did rows change?
        id: diff
        run: |
          if git diff --quiet -- data/harvest.json; then
            git checkout -- data/harvest-status.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit only when rows changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "fraudtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harvest.json data/harvest-status.json
          git commit -m "harvest: ledger update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --quiet && git push
      - name: Stage public files
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: mkdir -p _site && cp data/harvest.json data/harvest-status.json _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: _site

  publish:
    needs: harvest
    if: needs.harvest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
