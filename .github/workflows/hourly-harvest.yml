name: Hourly ledger harvest

on:
  schedule:
    # 3x daily, Mon-Fri, ~9 AM, 12 PM, 5 PM Central (Krennic 2026-10-22). CDT = UTC-5.
    # After DST ends Nov 1 (CST = UTC-6), change to "7 15,18,23 * * 1-5".
    - cron: "7 14,17,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-ledger-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      LEDGER_HARVEST_FILE: data/harvest.json
      LEDGER_STATUS_FILE: data/harvest-status.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A pushed harvest.json edit (seeds, hand fixes) that was not re-stamped is caught here, before the meta test.
      - name: Re-stamp harvest-meta.json if stale
        run: node scripts/write-meta.mjs
      - name: Tests
        run: node --test scripts/ledger-dedupe.test.mjs scripts/harvest-parse.test.mjs scripts/ledger-id.test.mjs scripts/harvest-sources.test.mjs scripts/harvest-opa-roundup.test.mjs scripts/harvest-exclude.test.mjs scripts/harvest-gaps.test.mjs scripts/harvest-private-victim.test.mjs scripts/harvest-fixes-1020b.test.mjs scripts/harvest-voting-crosspost.test.mjs scripts/harvest-roundup-all.test.mjs scripts/harvest-state-sources.test.mjs scripts/harvest-meta.test.mjs scripts/harvest-voting-from-status.test.mjs
      - name: Harvest official papers
        run: node scripts/harvest-gov.mjs
      - name: Cut duplicates, blank photos
        run: node scripts/ledger-dedupe.mjs data/harvest.json
      - name: Pre-publish check (fail on duplicate ids or schemeId spanning releases)
        run: node scripts/ledger-id.mjs data/harvest.json
      # write-meta.mjs runs every time: it keeps updatedAt when harvest.json is unchanged (same sha256) and re-stamps it
      # whenever harvest.json changed, in this run or in a pushed commit.
      - name: Stamp harvest-meta.json
        run: node scripts/write-meta.mjs
      - name: Did rows change?
        id: diff
        run: |
          if git diff --quiet -- data/harvest.json data/harvest-meta.json; then
            git checkout -- data/harvest-status.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit only when rows changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "fraudtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harvest.json data/harvest-status.json data/harvest-meta.json
          git commit -m "harvest: ledger update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --quiet && git push
      - name: Stage public files
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: mkdir -p _site && cp data/harvest.json data/harvest-meta.json data/harvest-status.json _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: _site

  publish:
    needs: harvest
    if: needs.harvest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
